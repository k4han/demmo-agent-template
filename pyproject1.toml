[project]
name = "demmo-agent"
version = "0.1.0"
description = "Simple Python CLI agent with FastAPI, installed and managed by uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
]

[project.scripts]
agent = "demmo_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
